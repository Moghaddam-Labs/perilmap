name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets CI be started by hand from the Actions tab, for when GitHub misses a push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the newest one in use.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --strict-markers -ra

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Check the API types match the API's contract
        run: |
          npm run api:types
          git diff --exit-code src/lib/api/schema.d.ts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  image:
    # The real data files aren't in the repo, so this proves the image builds and its code imports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p grids && touch grids/placeholder
      - run: docker build -t perilmap-api .
      - run: docker run --rm perilmap-api python -c "import perilmap.api.app, perilmap.regions.london.region"
      - name: Refuse to start without data
        run: |
          if docker run --rm perilmap-api python -c "import perilmap.api.main as m; m.build_registry()"; then
            exit 1
          fi
