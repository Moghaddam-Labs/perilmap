[project]
name = "perilmap"
version = "0.1.0"
description = "Shows how exposed the area around a home is to climate-related perils."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Shaz Moghaddam" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2",
    "pyogrio>=0.10",
    "rasterio>=1.4",
    "shapely>=2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Only the data test needs this, and it's large, so the deployed app leaves it out.
data = ["pyarrow>=17"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
